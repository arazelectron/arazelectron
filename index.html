<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="./logo.png" />
  <title>Texniki İşlər - Araz Electron</title>
  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#0f1b33;
      --card:#0f1a2f;
      --text:#eaf0ff;
      --muted:#a9b6d3;
      --accent:#ff8a00;
      --accent2:#ffd28a;
      --border: rgba(255,138,0,.35);
      --shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 15% 20%, rgba(255,138,0,.20), transparent 60%),
        radial-gradient(800px 500px at 85% 75%, rgba(110,168,255,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:grid;
      place-items:center;
      padding:24px;
    }

    .wrap{ width:min(920px, 100%); }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
      border-radius:22px;
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .topbar{
      padding:18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.10);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      letter-spacing:.2px;
    }

    /* ✅ LOGO */
    .logo{
      height:100px;
      width:auto;
    }

    .status{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:14px;
      color:var(--muted);
      white-space:nowrap;
    }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      background: rgba(255,138,0,.12);
      border:1px solid rgba(255,138,0,.28);
      color: var(--accent2);
      font-weight:600;
    }

    .content{
      padding:34px 22px 26px;
      display:grid;
      grid-template-columns: 1.25fr .75fr;
      gap:22px;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(24px, 3.6vw, 40px);
      line-height:1.1;
      letter-spacing:-.4px;
    }
    p{
      margin:0 0 14px;
      color: var(--muted);
      font-size:16px;
      line-height:1.65;
      max-width: 56ch;
    }

    .note{
      margin-top:18px;
      padding:14px 14px;
      border-radius:16px;
      border:1px dashed rgba(255,255,255,.14);
      background: rgba(0,0,0,.12);
      color: rgba(234,240,255,.9);
      font-size:14px;
    }

    .side{
      border-radius:18px;
      padding:18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.12);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-self:start;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,138,0,.35);
      background: linear-gradient(180deg, rgba(255,138,0,.18), rgba(255,138,0,.10));
      color: var(--text);
      text-decoration:none;
      font-weight:650;
      transition:.18s transform ease, .18s filter ease;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.06); }

    .footer{
      padding:16px 22px 18px;
      border-top:1px solid rgba(255,255,255,.08);
      display:flex;
      justify-content:space-between;
      color: rgba(169,182,211,.9);
      font-size:13px;
      background: rgba(0,0,0,.08);
    }

    @media (max-width: 760px){
      .content{ grid-template-columns: 1fr; }
    }

    .spinner{
      width:18px;height:18px;border-radius:50%;
      border:2px solid rgba(255,255,255,.25);
      border-top-color: var(--accent);
      animation: spin .9s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">

      <div class="topbar">
        <div class="brand">
          <!-- ✅ SƏNİN LOGO -->
          <img src="logobasliq.png" class="logo" >
        </div>

         <div class="status">
          <span class="pill">Araz Electron - Texniki işlər gedir</span>
        </div>
      </div>

      <div class="content">
        <div>
          <h1>Sayt hal hazırda təmirdədir, tezliklə xidmətinizdə olacaq</h1>
        </div>

        <aside class="side">
          <h2>Aşagıdakı buton ile İnstagram sehifemize baxa bilersiniz </h2>

          <!-- ✅ INSTAGRAM -->
          <a class="btn"
             href="https://instagram.com/arazelectron"
             target="_blank">
             🅾 Instagram
          </a>
        </aside>
      </div>

      <div class="footer">
        <span>© 2026 Araz Electron</span>
      </div>

    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Müvəqqəti Texniki İşlər</title>

  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#0f1b33;
      --text:#eaf0ff;
      --muted:#a9b6d3;
      --accent:#ff8a00;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(800px 500px at 20% 20%, rgba(255,138,0,.15), transparent),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(900px,100%);
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      padding:40px 25px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }

    /* 🔥 LOGO */
    .logo{
      width:120px;
      max-width:40%;
      margin-bottom:15px;
    }

    h1{
      margin:10px 0;
      font-size: clamp(24px,4vw,36px);
    }

    p{
      color:var(--muted);
      font-size:16px;
      line-height:1.6;
      max-width:600px;
      margin:0 auto 20px;
    }

    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:20px;
    }

    .btn{
      padding:12px 18px;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      border:1px solid rgba(255,138,0,.4);
      background:rgba(255,138,0,.15);
      color:#fff;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-2px);
      background:rgba(255,138,0,.25);
    }

    .footer{
      margin-top:25px;
      font-size:13px;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- ✅ LOGO -->
    <img src="logo.png" alt="Araz Electron" class="logo">

    <h1>Sayt müvəqqəti olaraq bağlıdır</h1>

    <p>
      Serverdə yaranmış texniki problem səbəbilə sayt qısa müddətlik dayandırılıb.
      Narahatçılığa görə üzr istəyirik. Çox tezliklə yenidən xidmətinizdə olacağıq.
    </p>

    <div class="buttons">
      <!-- 📞 İSTƏSƏN TELEFON ƏLAVƏ EDƏ BİLƏRSƏN -->

      <!-- 📸 INSTAGRAM -->
      <a class="btn"
         href="https://www.instagram.com/arazelectron/"
         target="_blank">
         Instagram səhifəmiz
      </a>
    </div>

    <div class="footer">
      © 2026 Araz Electron
    </div>

  </div>
</body>
</html>
